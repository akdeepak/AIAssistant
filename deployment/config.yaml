database:
  type: sqlite
  connection_string: sqlite:///./database.db

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - console
    - file
  file_handler:
    filename: logs/app.log
    max_bytes: 10485760
    backup_count: 5

api:
  version: v1
  title: AIWordingAssist API
  description: API for AI Wording Assistance
  contact:
    name: Support Team
    email: support@aiwordingassist.com

services:
  ingestion:
    max_file_size: 10485760  # 10 MB
    allowed_file_types:
      - pdf
      - docx
      - txt

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score

deployment:
  environment: production
  host: 0.0.0.0
  port: 8000
  cors:
    allow_origins:
      - "*"
    allow_methods:
      - GET
      - POST
      - OPTIONS
    allow_headers:
      - Content-Type
      - Authorization

vector_db:
  type: qdrant
  connection_string: http://localhost:6333

embedding:
  model: sentence-transformer
  model_name: "all-MiniLM-L6-v2"